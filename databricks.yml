bundle:
  name: transit-reliability

include:
  - resources/*.yml

# Only what the workspace needs is uploaded. The jobs run from the built wheel, not from
# these files, so docs, tests, scripts, and the Worker stay local.
sync:
  exclude:
    - docs/**
    - tests/**
    - scripts/**
    - workers/**
    - .github/**
    - CLAUDE.md
    - README.md
    - design_doc.md

artifacts:
  default:
    type: whl
    build: uv build --wheel --out-dir dist
    path: .

variables:
  schema_prefix:
    description: Prefix for bronze, silver, gold, ml, and ops schemas.
    default: transit
  landing_volume:
    description: Fully qualified raw landing volume.
    default: workspace.transit_landing.raw
  state_volume:
    description: Fully qualified state volume for checkpoints and exports.
    default: workspace.transit_ops.state
  ingest_pause_status:
    description: Whether the scheduled ingest job is paused.
    default: UNPAUSED
  silver_pause_status:
    description: Whether the scheduled silver job is paused (separate so each can be held).
    default: UNPAUSED
  monitor_pause_status:
    description: Whether the hourly monitor job is paused.
    default: UNPAUSED

targets:
  dev:
    mode: development
    default: true
    workspace:
      profile: enpu
    variables:
      schema_prefix: dev_transit
      ingest_pause_status: PAUSED
      silver_pause_status: PAUSED
      monitor_pause_status: PAUSED
  prod:
    mode: production
    workspace:
      profile: enpu
      root_path: /Workspace/Users/youenpu@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      schema_prefix: transit
      ingest_pause_status: UNPAUSED
      silver_pause_status: UNPAUSED
      monitor_pause_status: UNPAUSED
