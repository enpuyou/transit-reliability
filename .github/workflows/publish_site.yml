name: publish-site

# Publish the transparency site (site/) to GitHub Pages every 15 minutes. The page never queries
# Databricks: a Databricks job writes one JSON file of aggregates (public/site.json in the state
# volume, rebuilt hourly), and this workflow copies that file and adds status.json: live probes from
# scripts/watchdog.py (collector file age, job runs), which cost no Databricks compute. The page shows
# the age of both. If site.json is older than 3 hours the page is STILL published (so visitors see the
# warning and the probes) and the run then fails, so GitHub emails the owner.
# Needs repo secrets DATABRICKS_HOST and DATABRICKS_TOKEN (same as watchdog). GitHub Pages must be set
# to "GitHub Actions" as its source (docs/commands.md, "Transparency site").

on:
  schedule:
    - cron: "*/15 * * * *" # GitHub may delay scheduled runs; the page warns when probes are over 45 min old
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/publish_site.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: databricks/setup-cli@v1.20.0
        with:
          version: 1.20.0

      - name: Check secrets are configured
        run: |
          test -n "$DATABRICKS_HOST" || { echo "DATABRICKS_HOST secret is missing"; exit 1; }
          test -n "$DATABRICKS_TOKEN" || { echo "DATABRICKS_TOKEN secret is missing"; exit 1; }

      - name: Fetch the data file
        run: |
          mkdir -p site/data
          databricks fs cp dbfs:/Volumes/workspace/transit_ops/state/public/site.json site/data/site.json --overwrite

      - name: Live probes (status.json)
        # never blocks publishing: a failing probe is exactly what visitors need to see
        run: python3 scripts/watchdog.py --json-out site/data/status.json || true

      - name: Check the data file is valid and how old it is
        id: fresh
        run: |
          python3 - <<'PY'
          import datetime as dt, json, os
          data = json.load(open("site/data/site.json"))
          generated = dt.datetime.fromisoformat(data["generated_at"])
          age = (dt.datetime.now(dt.UTC) - generated).total_seconds() / 3600
          print(f"site.json built {generated:%Y-%m-%d %H:%M} UTC ({age:.1f} h ago), tables: {len(data['tables'])}")
          assert data.get("attribution"), "attribution legend missing"
          assert {"pipeline_tables", "check_latest", "hourly_snapshots"} <= set(data["tables"]), "required tables missing"
          if data.get("errors"):
              print("sections unavailable:", ", ".join(data["errors"]))
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"stale={'true' if age >= 3 else 'false'}\nage={age:.1f}\n")
          PY

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Fail the run if the data is stale (after publishing, so visitors see the warning)
        if: steps.fresh.outputs.stale == 'true'
        run: |
          echo "site data is ${{ steps.fresh.outputs.age }} h old (limit 3 h): the Databricks monitor job is not refreshing it"
          exit 1
