name: watchdog

# Hourly external check that the pipeline is alive, run from OUTSIDE Databricks on purpose: a job
# that never starts leaves no failed run and sends no email (2026-10-19: eleven ingest runs silently
# missing). The run goes red, and GitHub emails the repo owner, when:
#   - the collector has not landed a file recently,
#   - the ingest or monitor job has not started recently or its latest run did not succeed,
#   - the daily silver job has not run (and succeeded) today once it is due,
#   - or Databricks cannot be reached (for example an expired token).
# Needs repo secrets DATABRICKS_HOST and DATABRICKS_TOKEN (the same ones as daily-gtfs-static).
# It reads only the jobs API and the landing listing and never touches the SQL warehouse.
# The summary of every run is on the Actions page, so "all green" can be read there too.
# GitHub disables scheduled workflows after 60 days without repository activity; see docs/runbook.md.

on:
  schedule:
    - cron: "20 * * * *" # :20 past each hour; GitHub may delay scheduled runs by minutes
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: databricks/setup-cli@v1.20.0
        with:
          version: 1.20.0

      - name: Check secrets are configured
        run: |
          test -n "$DATABRICKS_HOST" || { echo "DATABRICKS_HOST secret is missing"; exit 1; }
          test -n "$DATABRICKS_TOKEN" || { echo "DATABRICKS_TOKEN secret is missing"; exit 1; }

      - name: Run the watchdog
        run: python3 scripts/watchdog.py
