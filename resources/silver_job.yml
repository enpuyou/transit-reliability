resources:
  jobs:
    silver_job:
      name: transit-reliability-${bundle.target}-silver
      # Daily, after the GitHub workflow uploads a new schedule (11:17 UTC): load new feeds, expand
      # the schedule (trips through tomorrow, stop times for realtime dates), then build the silver
      # realtime tables. Trip-update snapshots do not depend on the schedule and run alongside.
      # A run with nothing new is cheap; every step skips work it has already done.
      # Mail the deploying user when a run fails (nothing else; successes stay silent).
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      schedule:
        quartz_cron_expression: 0 45 11 * * ?
        timezone_id: UTC
        pause_status: ${var.silver_pause_status}
      tasks:
        - task_key: load_feeds
          python_wheel_task:
            package_name: transit_reliability
            entry_point: load_static_gtfs
            parameters:
              - --landing-volume
              - ${var.landing_volume}
              - --schema-prefix
              - ${var.schema_prefix}
          environment_key: default
        - task_key: expand_trips
          depends_on:
            - task_key: load_feeds
          python_wheel_task:
            package_name: transit_reliability
            entry_point: expand_trips
            parameters:
              - --schema-prefix
              - ${var.schema_prefix}
          environment_key: default
        - task_key: trip_updates
          python_wheel_task:
            package_name: transit_reliability
            entry_point: build_silver_trip_updates
            parameters:
              - --schema-prefix
              - ${var.schema_prefix}
          environment_key: default
        - task_key: expand_schedule
          depends_on:
            - task_key: load_feeds
          python_wheel_task:
            package_name: transit_reliability
            entry_point: expand_schedule
            parameters:
              - --schema-prefix
              - ${var.schema_prefix}
          environment_key: default
        - task_key: vehicle_positions
          depends_on:
            - task_key: expand_trips
          python_wheel_task:
            package_name: transit_reliability
            entry_point: build_silver_vehicle_positions
            parameters:
              - --schema-prefix
              - ${var.schema_prefix}
          environment_key: default
        - task_key: stop_visits
          depends_on:
            - task_key: vehicle_positions
            - task_key: expand_schedule
          python_wheel_task:
            package_name: transit_reliability
            entry_point: build_silver_stop_visits
            parameters:
              - --schema-prefix
              - ${var.schema_prefix}
          environment_key: default
        - task_key: trip_performance
          depends_on:
            - task_key: stop_visits
            - task_key: trip_updates
            - task_key: expand_trips
          python_wheel_task:
            package_name: transit_reliability
            entry_point: build_gold_trip_performance
            parameters:
              - --schema-prefix
              - ${var.schema_prefix}
          environment_key: default
        - task_key: prediction_errors
          depends_on:
            - task_key: stop_visits
            - task_key: trip_updates
          python_wheel_task:
            package_name: transit_reliability
            entry_point: build_gold_prediction_errors
            parameters:
              - --schema-prefix
              - ${var.schema_prefix}
          environment_key: default
        - task_key: route_performance
          depends_on:
            - task_key: trip_performance
          python_wheel_task:
            package_name: transit_reliability
            entry_point: build_gold_route_performance
            parameters:
              - --schema-prefix
              - ${var.schema_prefix}
          environment_key: default
        - task_key: prediction_accuracy
          depends_on:
            - task_key: prediction_errors
          python_wheel_task:
            package_name: transit_reliability
            entry_point: build_gold_prediction_accuracy
            parameters:
              - --schema-prefix
              - ${var.schema_prefix}
          environment_key: default
        - task_key: segment_runs
          depends_on:
            - task_key: stop_visits
          python_wheel_task:
            package_name: transit_reliability
            entry_point: build_gold_segment_runs
            parameters:
              - --schema-prefix
              - ${var.schema_prefix}
          environment_key: default
        - task_key: segment_runtimes
          depends_on:
            - task_key: segment_runs
          python_wheel_task:
            package_name: transit_reliability
            entry_point: build_gold_segment_runtimes
            parameters:
              - --schema-prefix
              - ${var.schema_prefix}
          environment_key: default
        - task_key: headway_pairs
          depends_on:
            - task_key: stop_visits
          python_wheel_task:
            package_name: transit_reliability
            entry_point: build_gold_headway_pairs
            parameters:
              - --schema-prefix
              - ${var.schema_prefix}
          environment_key: default
        - task_key: headway_summary
          depends_on:
            - task_key: headway_pairs
          python_wheel_task:
            package_name: transit_reliability
            entry_point: build_gold_headway_summary
            parameters:
              - --schema-prefix
              - ${var.schema_prefix}
          environment_key: default
        - task_key: weather
          python_wheel_task:
            package_name: transit_reliability
            entry_point: build_silver_weather
            parameters:
              - --schema-prefix
              - ${var.schema_prefix}
              - --landing-volume
              - ${var.landing_volume}
          environment_key: default
        - task_key: weather_impact
          depends_on:
            - task_key: weather
            - task_key: trip_performance
            - task_key: segment_runs
          python_wheel_task:
            package_name: transit_reliability
            entry_point: build_gold_weather_impact
            parameters:
              - --schema-prefix
              - ${var.schema_prefix}
          environment_key: default
        - task_key: health_checks
          depends_on:
            - task_key: route_performance
            - task_key: prediction_accuracy
            - task_key: segment_runtimes
            - task_key: headway_summary
            - task_key: weather_impact
          python_wheel_task:
            package_name: transit_reliability
            entry_point: run_health_checks
            parameters:
              - --schema-prefix
              - ${var.schema_prefix}
          environment_key: default
        - task_key: daily_checks
          depends_on:
            - task_key: health_checks
          python_wheel_task:
            package_name: transit_reliability
            entry_point: run_monitor
            parameters:
              - --schema-prefix
              - ${var.schema_prefix}
              - --suite
              - daily
          environment_key: default
        - task_key: publish_all
          depends_on:
            - task_key: daily_checks
          # default run_if (all upstream succeeded): if any build or check failed the job fails and
          # emails; the hourly monitor job keeps the page's live sections current meanwhile
          python_wheel_task:
            package_name: transit_reliability
            entry_point: publish_site
            parameters:
              - --schema-prefix
              - ${var.schema_prefix}
              - --state-volume
              - ${var.state_volume}
              - --parts
              - all
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "3"
            dependencies:
              - ../dist/*.whl
