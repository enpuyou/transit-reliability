resources:
  jobs:
    silver_job:
      name: transit-reliability-${bundle.target}-silver
      # Daily, after the GitHub workflow uploads a new schedule (11:17 UTC): load new feeds,
      # expand the schedule for dates with realtime data, then build silver vehicle positions.
      # A run with nothing new is cheap; every step skips work it has already done.
      schedule:
        quartz_cron_expression: 0 45 11 * * ?
        timezone_id: UTC
        pause_status: ${var.ingest_pause_status}
      tasks:
        - task_key: load_feeds
          python_wheel_task:
            package_name: transit_reliability
            entry_point: load_static_gtfs
            parameters:
              - --landing-volume
              - ${var.landing_volume}
              - --schema-prefix
              - ${var.schema_prefix}
          environment_key: default
        - task_key: expand_schedule
          depends_on:
            - task_key: load_feeds
          python_wheel_task:
            package_name: transit_reliability
            entry_point: expand_schedule
            parameters:
              - --schema-prefix
              - ${var.schema_prefix}
          environment_key: default
        - task_key: vehicle_positions
          depends_on:
            - task_key: expand_schedule
          python_wheel_task:
            package_name: transit_reliability
            entry_point: build_silver_vehicle_positions
            parameters:
              - --schema-prefix
              - ${var.schema_prefix}
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "3"
            dependencies:
              - ../dist/*.whl
