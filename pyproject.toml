[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "transit-reliability"
version = "0.1.0"
description = "Seattle transit reliability data and analytics"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "gtfs-realtime-bindings>=1.0.0",
    "protobuf>=5.26.0",
]

[project.scripts]
setup_schemas = "transit_reliability.entrypoints.jobs:setup_schemas"
ingest_bronze = "transit_reliability.entrypoints.jobs:ingest_bronze"
load_static_gtfs = "transit_reliability.entrypoints.jobs:load_static_gtfs"
expand_schedule = "transit_reliability.entrypoints.jobs:expand_schedule"
build_silver_vehicle_positions = "transit_reliability.entrypoints.jobs:build_silver_vehicle_positions"
expand_trips = "transit_reliability.entrypoints.jobs:expand_trips"
build_silver_trip_updates = "transit_reliability.entrypoints.jobs:build_silver_trip_updates"
build_silver_stop_visits = "transit_reliability.entrypoints.jobs:build_silver_stop_visits"
run_monitor = "transit_reliability.entrypoints.jobs:run_monitor"
publish_site = "transit_reliability.entrypoints.jobs:publish_site"
export_map_history = "transit_reliability.entrypoints.jobs:export_map_history"
fail_job = "transit_reliability.entrypoints.jobs:fail_job"
build_gold_segment_runs = "transit_reliability.entrypoints.jobs:build_gold_segment_runs"
build_gold_segment_runtimes = "transit_reliability.entrypoints.jobs:build_gold_segment_runtimes"
build_gold_weather_impact = "transit_reliability.entrypoints.jobs:build_gold_weather_impact"
build_silver_events = "transit_reliability.entrypoints.jobs:build_silver_events"
build_gold_event_routes = "transit_reliability.entrypoints.jobs:build_gold_event_routes"
build_silver_weather = "transit_reliability.entrypoints.jobs:build_silver_weather"
build_gold_headway_pairs = "transit_reliability.entrypoints.jobs:build_gold_headway_pairs"
build_gold_headway_summary = "transit_reliability.entrypoints.jobs:build_gold_headway_summary"
build_gold_trip_performance = "transit_reliability.entrypoints.jobs:build_gold_trip_performance"
build_gold_prediction_errors = "transit_reliability.entrypoints.jobs:build_gold_prediction_errors"
build_gold_route_performance = "transit_reliability.entrypoints.jobs:build_gold_route_performance"
build_gold_prediction_accuracy = "transit_reliability.entrypoints.jobs:build_gold_prediction_accuracy"
run_health_checks = "transit_reliability.entrypoints.jobs:run_health_checks"

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/transit_reliability"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["pyspark.*", "pandas"]
ignore_missing_imports = true
