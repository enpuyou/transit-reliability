[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "transit-reliability"
version = "0.1.0"
description = "Seattle transit reliability data and analytics"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "gtfs-realtime-bindings>=1.0.0",
    "protobuf>=5.26.0",
]

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/transit_reliability"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
