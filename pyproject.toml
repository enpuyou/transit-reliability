[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "transit-reliability"
version = "0.1.0"
description = "Seattle transit reliability data and analytics"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "gtfs-realtime-bindings>=1.0.0",
    "protobuf>=5.26.0",
]

[project.scripts]
setup_schemas = "transit_reliability.entrypoints.jobs:setup_schemas"
ingest_bronze = "transit_reliability.entrypoints.jobs:ingest_bronze"
load_static_gtfs = "transit_reliability.entrypoints.jobs:load_static_gtfs"
expand_schedule = "transit_reliability.entrypoints.jobs:expand_schedule"
build_silver_vehicle_positions = "transit_reliability.entrypoints.jobs:build_silver_vehicle_positions"
expand_trips = "transit_reliability.entrypoints.jobs:expand_trips"
build_silver_trip_updates = "transit_reliability.entrypoints.jobs:build_silver_trip_updates"
build_silver_stop_visits = "transit_reliability.entrypoints.jobs:build_silver_stop_visits"

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/transit_reliability"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["pyspark.*", "pandas"]
ignore_missing_imports = true
